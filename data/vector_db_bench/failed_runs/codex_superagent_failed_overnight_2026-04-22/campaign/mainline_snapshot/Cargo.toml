[package]
name = "vector-db-skeleton"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
half = "2"
libc = "0.2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rayon = "1.10"
rustc-hash = "2"

[profile.release]
lto = true
codegen-units = 1
debug = false
panic = "abort"
